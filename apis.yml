aid: exotec
name: Exotec
description: 'Exotec is a French warehouse automation manufacturer and integrator, founded
  in 2015 and headquartered in Croix, France, that builds the Skypod robotic automated
  storage and retrieval system (AS/RS) and the Deepsky warehouse execution system (WES)
  that orchestrates it. Skypod combines autonomous three-dimensional mobile robots,
  modular racking, picking workstations and inbound exchangers into an all-in-one goods-to-person
  system; Deepsky is the software layer that coordinates the robots, stations and third-party
  equipment and connects the installation to a customer''s WMS or WCS over a RESTful
  web-services interface. Exotec reports more than 10,000 robots deployed across over
  200 customer sites for more than 50 brands including Decathlon, Renault Group, DSV,
  Carrefour, Gap and Uniqlo, serving apparel, general merchandise, aftermarket parts,
  grocery, third-party logistics and healthcare fulfillment. The Deepsky WMS integration
  interface is delivered as customer-specific documentation under a commercial deployment
  rather than a public developer program, so Exotec publishes no open developer portal,
  API reference or SDK. It does publish an llms.txt at its web root and holds ISO/IEC
  27001:2022 certification and SOC 2 Type 2 compliance.'
